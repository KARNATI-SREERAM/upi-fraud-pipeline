# Runs the whole pipeline locally with one command: `docker compose up --build`.
# Phase 1: a single Kafka broker (KRaft mode), a one-shot topic creator, and the producer.

services:
  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9094:9094"  # only the EXTERNAL listener is exposed to your Mac
    environment:
      # KRaft: this one node is both the broker (stores data) and the controller (cluster
      # metadata), so no ZooKeeper is needed.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qg
      # Two client listeners: containers connect to kafka:9092, your Mac to localhost:9094.
      # "Advertised" = the address the broker tells clients to reconnect to, so it must be
      # reachable from wherever that client runs.
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Single broker, so internal topics can only have 1 replica.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics must be created on purpose (by kafka-init), so a typo can't silently make a new one.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xmx512M -Xms512M  # cap JVM memory for an 8 GB laptop
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

  kafka-init:
    # Same image, used only for its CLI tools. Creates the topics, then exits.
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for t in transactions.raw transactions.clean transactions.flagged; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic "$$t" --partitions 3 --replication-factor 1
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
    restart: "no"

  producer:
    build: ./producer
    depends_on:
      kafka-init:
        condition: service_completed_successfully  # only start once topics exist
    environment:
      # ${VAR:-default}: use the value from .env if present, otherwise the default.
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      TXNS_PER_SEC: ${TXNS_PER_SEC:-20}
      FRAUD_RATE: ${FRAUD_RATE:-0.02}
      DIRTY_RATE: ${DIRTY_RATE:-0.05}
      NUM_USERS: ${NUM_USERS:-500}
      SEED: ${SEED:-42}
    restart: unless-stopped
