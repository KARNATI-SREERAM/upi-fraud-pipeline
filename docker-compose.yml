# Runs the whole pipeline locally with one command: `docker compose up --build`.
# Kafka (KRaft) + topic creator + producer -> processor (with fraud model) -> PostgreSQL.

services:
  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9094:9094"  # only the EXTERNAL listener is exposed to your Mac
    environment:
      # KRaft: this one node is both the broker (stores data) and the controller (cluster
      # metadata), so no ZooKeeper is needed.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qg
      # Two client listeners: containers connect to kafka:9092, your Mac to localhost:9094.
      # "Advertised" = the address the broker tells clients to reconnect to, so it must be
      # reachable from wherever that client runs.
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # Single broker, so internal topics can only have 1 replica.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics must be created on purpose (by kafka-init), so a typo can't silently make a new one.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xmx512M -Xms512M  # cap JVM memory for an 8 GB laptop
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 15s

  kafka-init:
    # Same image, used only for its CLI tools. Creates the topics, then exits.
    image: apache/kafka:3.9.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for t in transactions.raw transactions.clean transactions.flagged; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic "$$t" --partitions 3 --replication-factor 1
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
    restart: "no"

  producer:
    build: ./producer
    depends_on:
      kafka-init:
        condition: service_completed_successfully  # only start once topics exist
    environment:
      # ${VAR:-default}: use the value from .env if present, otherwise the default.
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      TXNS_PER_SEC: ${TXNS_PER_SEC:-20}
      FRAUD_RATE: ${FRAUD_RATE:-0.02}
      DIRTY_RATE: ${DIRTY_RATE:-0.05}
      NUM_USERS: ${NUM_USERS:-2000}
      SEED: ${SEED:-42}
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pipeline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pipeline}
      POSTGRES_DB: ${POSTGRES_DB:-upi}
    ports:
      - "5433:5432"  # 5433 on your Mac, so it won't clash with a Postgres you already run on 5432
    volumes:
      - pgdata:/var/lib/postgresql/data           # data survives `docker compose down` (not `down -v`)
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro  # run once, on first start
    healthcheck:
      # $$ escapes $ for compose, so the shell inside the container expands the variable.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  trainer:
    # One-shot: trains the fraud model (deterministic, seed 42) into the shared `models` volume, then exits.
    build:
      context: .                    # project root, so the image can copy shared code
      dockerfile: model/Dockerfile
    volumes:
      - models:/models
    restart: "no"

  processor:
    build:
      context: .
      dockerfile: processor/Dockerfile
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      trainer:
        condition: service_completed_successfully  # the model file must exist before scoring
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DATABASE_URL: postgresql://${POSTGRES_USER:-pipeline}:${POSTGRES_PASSWORD:-pipeline}@postgres:5432/${POSTGRES_DB:-upi}
      MODEL_PATH: /models/model.joblib
    volumes:
      - models:/models:ro           # read-only: only the trainer writes models
    restart: unless-stopped  # if it crashes, Docker restarts it and Kafka replays uncommitted messages

volumes:
  pgdata:
  models:
